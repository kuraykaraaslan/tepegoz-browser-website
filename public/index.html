<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tepegöz</title>
    <link rel="canonical" href="/en/" />
    <meta http-equiv="refresh" content="0; url=/en/" />
    <meta name="robots" content="noindex" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff;
        color: #0c2135;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      a { color: #07697a; }
      @media (prefers-color-scheme: dark) {
        body { background: #07172e; color: #f3f7fb; }
        a { color: #06aec4; }
      }
    </style>
  </head>
  <body>
    <!--
      Locale entry point.

      The site is a static export with no middleware, so there is no server-side
      language negotiation. Vercel handles the real redirect (see vercel.json);
      this file is the fallback for any host that serves `out/` as plain files,
      and the <a> is the fallback for a client that honours neither.
    -->
    <p>Redirecting to <a href="/en/">tepegoz.app/en/</a>…</p>
  </body>
</html>
